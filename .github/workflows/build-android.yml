name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v5

      # ── 2. Node.js ─────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # ── 3. Install JS deps ─────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Build the Vite bundle ───────────────────────────────────────
      - name: Build web assets
        run: npm run build

      # ── 5. Java (for Gradle) ───────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      # ── 6. Sync Capacitor web assets into Android project ─────────────
      - name: Capacitor sync
        run: npx cap sync android

      # ── 7. Cache Gradle to speed up future runs ────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── 8. Make gradlew executable ─────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 9. Build the debug APK ─────────────────────────────────────────
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      # ── 10. Upload APK as a downloadable artifact ──────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: read-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
